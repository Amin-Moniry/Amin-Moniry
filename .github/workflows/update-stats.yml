name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * *"   # every day, 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate stat cards
        run: python scripts/update_stats.py
        env:
          GH_USER: Amin-Moniry
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/streak.svg assets/activity.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile stats"
            git push
          fi
